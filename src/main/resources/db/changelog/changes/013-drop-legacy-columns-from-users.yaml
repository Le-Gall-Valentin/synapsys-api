databaseChangeLog:
  - changeSet:
      id: 013-drop-legacy-columns-from-users
      author: synapsys
      changes:
        - dropColumn:
            tableName: users
            columnName: password_hash
        - dropColumn:
            tableName: users
            columnName: totp_secret
        - dropColumn:
            tableName: users
            columnName: totp_enabled
      rollback:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(255)
              - column:
                  name: totp_secret
                  type: VARCHAR(32)
              - column:
                  name: totp_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false