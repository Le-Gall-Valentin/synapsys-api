databaseChangeLog:
  - changeSet:
      id: 009-totp-invariant-check
      author: system
      comment: >
        Enforces the application invariant that a user with totp_enabled=true must
        always have a non-null totp_secret. Without this constraint, a data inconsistency
        (e.g. direct DB manipulation) could leave the system in an unvalidatable state.
      changes:
        - sql:
            sql: >
              ALTER TABLE users
              ADD CONSTRAINT chk_totp_secret_required
              CHECK (totp_secret IS NOT NULL OR totp_enabled = false);