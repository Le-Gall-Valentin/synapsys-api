databaseChangeLog:
  - changeSet:
      id: 003-add-refresh-token-expiry-index
      author: synapsys
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_refresh_tokens_expires_at
      changes:
        - createIndex:
            indexName: idx_refresh_tokens_expires_at
            tableName: refresh_tokens
            columns:
              - column:
                  name: expires_at
        - createIndex:
            indexName: idx_refresh_tokens_revoked_expires
            tableName: refresh_tokens
            columns:
              - column:
                  name: revoked
              - column:
                  name: expires_at