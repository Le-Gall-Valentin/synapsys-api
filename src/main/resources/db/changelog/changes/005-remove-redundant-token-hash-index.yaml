databaseChangeLog:
  - changeSet:
      id: 005-remove-redundant-token-hash-index
      author: synapsys
      preConditions:
        - onFail: MARK_RAN
        - indexExists:
            indexName: idx_refresh_tokens_token_hash
      changes:
        - dropIndex:
            indexName: idx_refresh_tokens_token_hash
            tableName: refresh_tokens