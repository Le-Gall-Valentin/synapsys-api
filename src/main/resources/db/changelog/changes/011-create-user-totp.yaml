databaseChangeLog:
  - changeSet:
      id: 011-create-user-totp
      author: synapsys
      changes:
        - createTable:
            tableName: user_totp
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_totp_user
                    references: users(id)
              - column:
                  name: totp_secret
                  type: VARCHAR(256)
                  constraints:
                    nullable: true
              - column:
                  name: totp_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: "INSERT INTO user_totp (user_id, totp_secret, totp_enabled) SELECT id, totp_secret, totp_enabled FROM users"
      rollback:
        - dropTable:
            tableName: user_totp
