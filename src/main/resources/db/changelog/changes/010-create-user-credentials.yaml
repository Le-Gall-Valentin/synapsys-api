databaseChangeLog:
  - changeSet:
      id: 010-create-user-credentials
      author: synapsys
      changes:
        - createTable:
            tableName: user_credentials
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_credentials_user
                    references: users(id)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - sql:
            sql: "INSERT INTO user_credentials (user_id, password_hash) SELECT id, password_hash FROM users"
        - dropNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(255)
      rollback:
        - addNotNullConstraint:
            tableName: users
            columnName: password_hash
            columnDataType: VARCHAR(255)
        - dropTable:
            tableName: user_credentials