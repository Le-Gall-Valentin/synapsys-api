databaseChangeLog:
  - changeSet:
      id: 008-create-agent-enrollment-tokens
      author: synapsys
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: agent_enrollment_tokens
      changes:
        - createTable:
            tableName: agent_enrollment_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: server_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMPTZ
              - column:
                  name: revoked_at
                  type: TIMESTAMPTZ
              - column:
                  name: revoked_by
                  type: UUID
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: agent_enrollment_tokens
            columnNames: token_hash
            constraintName: uq_agent_enrollment_tokens_token_hash
        - addForeignKeyConstraint:
            baseTableName: agent_enrollment_tokens
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_agent_enrollment_tokens_created_by
        - addForeignKeyConstraint:
            baseTableName: agent_enrollment_tokens
            baseColumnNames: revoked_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_agent_enrollment_tokens_revoked_by
        - createIndex:
            indexName: idx_agent_enrollment_tokens_created_by
            tableName: agent_enrollment_tokens
            columns:
              - column:
                  name: created_by
      rollback:
        - dropTable:
            tableName: agent_enrollment_tokens
            cascadeConstraints: true
