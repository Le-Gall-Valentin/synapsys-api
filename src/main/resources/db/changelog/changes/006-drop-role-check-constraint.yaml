databaseChangeLog:
  - changeSet:
      id: 006-drop-role-check-constraint
      author: synapsys
      comment: "Remove hardcoded role CHECK constraint so new Role enum values can be inserted without a schema migration."
      changes:
        - sql:
            sql: "ALTER TABLE users DROP CONSTRAINT IF EXISTS users_role_check;"
      rollback:
        - sql:
            sql: "ALTER TABLE users ADD CONSTRAINT users_role_check CHECK (role IN ('SUPER_ADMIN', 'ADMIN', 'USER'));"