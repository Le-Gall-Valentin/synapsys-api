databaseChangeLog:
  - changeSet:
      id: 012-migrate-totp-constraint
      author: synapsys
      comment: >
        Moves the TOTP invariant constraint from the users table to user_totp,
        where the data now lives. The constraint ensures that a user with
        totp_enabled=true must always have a non-null totp_secret.
      changes:
        - sql:
            sql: "ALTER TABLE users DROP CONSTRAINT chk_totp_secret_required"
        - sql:
            sql: >
              ALTER TABLE user_totp
              ADD CONSTRAINT chk_user_totp_secret_required
              CHECK (totp_secret IS NOT NULL OR totp_enabled = false)
      rollback:
        - sql:
            sql: "ALTER TABLE user_totp DROP CONSTRAINT chk_user_totp_secret_required"
        - sql:
            sql: >
              ALTER TABLE users
              ADD CONSTRAINT chk_totp_secret_required
              CHECK (totp_secret IS NOT NULL OR totp_enabled = false)