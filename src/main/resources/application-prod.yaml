spring:
  datasource:
    url: ${SYNAPSYS_DB_URL}
    username: ${SYNAPSYS_DB_USER}
    password: ${SYNAPSYS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

synapsys:
  jwt:
    secret: ${SYNAPSYS_JWT_SECRET}
    expiry-minutes: ${SYNAPSYS_JWT_EXPIRY_MINUTES}
  refresh-token:
    expiry-days: ${SYNAPSYS_REFRESH_TOKEN_EXPIRY_DAYS}
  cookie:
    secure: ${SYNAPSYS_COOKIE_SECURE}
  seed:
    enabled: ${SYNAPSYS_SEED_ENABLED:false}
    username: ${SYNAPSYS_SEED_USERNAME:admin}
    email: ${SYNAPSYS_SEED_EMAIL:admin@synapsys.dev}
    password: ${SYNAPSYS_SEED_PASSWORD:}